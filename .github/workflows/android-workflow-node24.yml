name: Build YS IX Launcher APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # Pin to Ubuntu 24.04 instead of ubuntu-latest during the October/November 2026 migration.
    runs-on: ubuntu-24.04

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Verify source archive exists
        run: test -f YSIX-Launcher-v0.1-source.zip

      - name: Extract and build debug APK
        run: |
          unzip -q YSIX-Launcher-v0.1-source.zip -d project
          cd project/ysix-launcher-v0.1
          gradle --no-daemon :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: ysix-launcher-v0.1-debug-apk
          path: project/ysix-launcher-v0.1/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
