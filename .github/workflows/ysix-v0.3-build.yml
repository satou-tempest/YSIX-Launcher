name: Build YS IX Launcher v0.3

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Check source archive
        run: test -f YSIX-Launcher-v0.3-source.zip

      - name: Extract v0.3 project
        run: |
          mkdir -p project
          unzip -q YSIX-Launcher-v0.3-source.zip -d project
          test -f project/ysix-launcher-v0.3/app/build.gradle
          test -f project/ysix-launcher-v0.3/app/src/main/java/io/github/ysix/launcher/MainActivity.java
          test -f project/ysix-launcher-v0.3/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

      - name: Build debug APK
        run: |
          cd project/ysix-launcher-v0.3
          gradle --no-daemon :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: ysix-launcher-v0.3-debug-apk
          path: project/ysix-launcher-v0.3/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
