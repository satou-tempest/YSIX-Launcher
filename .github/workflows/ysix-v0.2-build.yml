name: Build YS IX Launcher v0.2

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Check required source archives
        run: |
          test -f YSIX-Launcher-v0.1-source.zip
          test -f YSIX-v0.2-Icon-Patch.zip

      - name: Extract project and apply v0.2 icon patch
        run: |
          mkdir -p project icon-patch
          unzip -q YSIX-Launcher-v0.1-source.zip -d project
          unzip -q YSIX-v0.2-Icon-Patch.zip -d icon-patch
          APP_DIR="project/ysix-launcher-v0.1/app"
          PATCH_DIR="icon-patch/ysix-v02-icon-patch/app"
          test -d "$APP_DIR/src/main"
          cp -a "$PATCH_DIR/src/main/res/." "$APP_DIR/src/main/res/"
          python3 - <<'PY'
          from pathlib import Path
          import re
          app = Path('project/ysix-launcher-v0.1/app')
          manifest = app / 'src/main/AndroidManifest.xml'
          text = manifest.read_text()
          text, count = re.subn(
              r'<application\b([^>]*)>',
              lambda m: '<application' + re.sub(r'\s+android:(?:icon|roundIcon)="[^"]*"', '', m.group(1))
              + ' android:icon="@mipmap/ic_launcher" android:roundIcon="@mipmap/ic_launcher_round">',
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit('Could not find the <application> tag in AndroidManifest.xml')
          manifest.write_text(text)

          gradle = app / 'build.gradle'
          text = gradle.read_text()
          text, code_count = re.subn(r'versionCode\s+\d+', 'versionCode 2', text, count=1)
          text, name_count = re.subn(r'versionName\s+[\"\'][^\"\']+[\"\']', 'versionName "0.2.0"', text, count=1)
          if code_count != 1 or name_count != 1:
              raise SystemExit('Could not update versionCode/versionName in app/build.gradle')
          gradle.write_text(text)
          PY

      - name: Build debug APK
        run: |
          cd project/ysix-launcher-v0.1
          gradle --no-daemon :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: ysix-launcher-v0.2-debug-apk
          path: project/ysix-launcher-v0.1/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
