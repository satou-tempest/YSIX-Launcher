name: Build YS IX v0.6 Temporary Relocation Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ARM64 temporary-relocation debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout YSIX repository
        uses: actions/checkout@v7

      - name: Extract v0.6 source archive
        shell: bash
        run: |
          set -euo pipefail
          test -f YSIX-Launcher-v0.6-source.zip
          mkdir -p project
          unzip -q YSIX-Launcher-v0.6-source.zip -d project
          ROOT="project/ysix-launcher-v0.6"
          test -f "$ROOT/app/src/main/cpp/CMakeLists.txt"
          test -f "$ROOT/app/src/main/cpp/native_loader.cpp"
          test -f "$ROOT/app/src/main/java/io/github/ysix/launcher/MainActivity.java"

      - name: Run host-side synthetic relocation regression test
        shell: bash
        run: |
          set -euo pipefail
          cd project/ysix-launcher-v0.6
          ./tests/run_native_loader_test.sh

      - name: Fetch pinned MIT-licensed generic Switch importer
        shell: bash
        run: |
          set -euo pipefail
          ROOT="project/ysix-launcher-v0.6"
          DEST="$ROOT/third_party/p5r-android/android/wonder/importer"
          BASE="https://raw.githubusercontent.com/Brandon04Gonzalez/p5r-android/645c717afbc0610f9da38b0cc1d6834820ffa76a"
          mkdir -p "$DEST" "$ROOT/third_party/p5r-android"
          for FILE in nximport.cpp nximport.h nxcrypto.cpp nxcrypto.h nxgame.h; do
            curl --fail --location --retry 3 "$BASE/android/wonder/importer/$FILE" -o "$DEST/$FILE"
          done
          curl --fail --location --retry 3 "$BASE/LICENSE" -o "$ROOT/third_party/p5r-android/LICENSE"
          test -s "$DEST/nximport.cpp"
          test -s "$DEST/nxcrypto.cpp"
          echo "Pinned upstream source: 645c717afbc0610f9da38b0cc1d6834820ffa76a"

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK, NDK and CMake
        uses: android-actions/setup-android@v4

      - name: Install Android build components
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;28.2.13676358" "cmake;3.22.1"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK (Java + ARM64 C++ + temporary relocation test + Vulkan)
        shell: bash
        run: |
          set -euo pipefail
          cd project/ysix-launcher-v0.6
          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Upload v0.6 temporary-relocation debug APK
        uses: actions/upload-artifact@v7
        with:
          name: ysix-v0.6-temporary-relocation-debug-apk
          path: project/ysix-launcher-v0.6/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
